name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 압축 파일이 있으면 풀기 (zip을 그대로 올린 경우 대응)
        run: |
          ZIP_FILE=$(ls ./*.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP_FILE" ]; then
            unzip -q "$ZIP_FILE" -d .
          fi

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: local.properties 생성 (API 키 주입)
        working-directory: AIVtuber
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> local.properties

      - name: 디버그 APK 빌드
        working-directory: AIVtuber
        run: gradle assembleDebug --stacktrace

      - name: APK를 Actions 아티팩트로 업로드
        uses: actions/upload-artifact@v4
        with:
          name: ai-vtuber-debug-apk
          path: AIVtuber/app/build/outputs/apk/debug/app-debug.apk
